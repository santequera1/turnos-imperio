<!DOCTYPE html>
<html lang="es">
<head>
    <title>Editar {{ cliente.nombre_cliente }} - Imperio Motos</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'turnos_app/styles.css' %}">
</head>
<body>

<nav class="navbar">
    <a href="{% url 'pagina_principal' %}">
        <img src="{% static 'turnos_app/logo-horizontal.png' %}" alt="Imperio Motos" class="navbar-logo">
    </a>
    <div class="navbar-links">
        <a href="{% url 'dashboard' %}">Historial</a>
        <a href="{% url 'dashboard_clientes' %}" class="active">Clientes</a>
        <a href="{% url 'agendar_turno' %}">Caja</a>
        <a href="{% url 'atender_turnos' %}">Mecanico</a>
        <a href="{% url 'logout' %}" class="danger">Salir</a>
    </div>
</nav>

<div class="container">
    <div class="page-content" style="max-width:480px; margin:0 auto;">
        <a href="{% url 'dashboard_cliente_detalle' cliente.id %}" class="btn btn-secondary btn-sm" style="margin-bottom:24px; display:inline-block;">&larr; Volver al perfil</a>

        <div class="form-card">
            <h1 class="page-title" style="margin-bottom:24px;">Editar Cliente</h1>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="nombre_cliente" value="{{ cliente.nombre_cliente }}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="numero_telefono" value="{{ cliente.numero_telefono }}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Motocicleta</label>
                    <input type="text" name="referencia_motocicleta" value="{{ cliente.referencia_motocicleta }}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Placa</label>
                    <input type="text" name="placa" value="{{ cliente.placa|default:'' }}" maxlength="20" class="form-control" style="text-transform:uppercase;">
                </div>

                <div style="display:flex; gap:12px; margin-top:8px;">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'dashboard_cliente_detalle' cliente.id %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
