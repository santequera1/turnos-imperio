<!DOCTYPE html>
<html lang="es">
<head>
    <title>Editar {{ cliente.nombre_cliente }} - Imperio Motos</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static "turnos_app/css/tailwind.css" %}">
</head>
<body class="bg-slate-950 min-h-screen" style="background-color: #000000; color: #FFFFFF">

<!-- NAVBAR -->
<nav class="fixed w-full z-20 top-0 left-0">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <a href="{% url 'pagina_principal' %}" class="flex items-center">
            <img src="{% static 'turnos_app/logo-horizontal.png' %}" alt="logo" class="h-8 mr-3">
        </a>
        <div class="flex items-center space-x-3">
            <a href="{% url 'dashboard' %}" class="px-4 py-2   rounded hover: text-sm">Historial</a>
            <a href="{% url 'dashboard_clientes' %}" class="px-4 py-2   rounded hover: text-sm">Clientes</a>
            <a href="{% url 'agendar_turno' %}" class="px-4 py-2   rounded hover: text-sm">Caja</a>
            <a href="{% url 'atender_turnos' %}" class="px-4 py-2   rounded hover: text-sm">Mec&aacute;nico</a>
            <a href="{% url 'logout' %}" class="px-4 py-2 text-red-300  rounded hover:bg-red-900 text-sm">Salir</a>
        </div>
    </div>
</nav>

<div class="pt-20 px-6 max-w-screen-xl mx-auto">

    <a href="{% url 'dashboard_cliente_detalle' cliente.id %}" class="hover:underline text-sm mb-4 inline-block">&larr; Volver al perfil</a>

    <div class="rounded-lg p-6 max-w-lg">
        <h1 class="text-white text-2xl font-bold mb-6">Editar Cliente</h1>

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-1">Nombre</label>
                <input type="text" name="nombre_cliente" value="{{ cliente.nombre_cliente }}"
                    class="w-full h-10 px-4 rounded  border  text-white focus:outline-none focus:">
            </div>

            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-1">Tel&eacute;fono</label>
                <input type="text" name="numero_telefono" value="{{ cliente.numero_telefono }}"
                    class="w-full h-10 px-4 rounded  border  text-white focus:outline-none focus:">
            </div>

            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-1">Motocicleta</label>
                <input type="text" name="referencia_motocicleta" value="{{ cliente.referencia_motocicleta }}"
                    class="w-full h-10 px-4 rounded  border  text-white focus:outline-none focus:">
            </div>

            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-1">Placa</label>
                <input type="text" name="placa" value="{{ cliente.placa|default:'' }}" maxlength="20"
                    class="w-full h-10 px-4 rounded  border  text-white focus:outline-none focus: uppercase">
            </div>

            <div class="flex space-x-3">
                <button type="submit" class="px-6 py-2  hover: text-white rounded text-sm font-medium">Guardar</button>
                <a href="{% url 'dashboard_cliente_detalle' cliente.id %}" class="px-6 py-2  hover:bg-slate-600 text-white rounded text-sm inline-flex items-center">Cancelar</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
