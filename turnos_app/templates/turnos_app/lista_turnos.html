<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imperio Motos | Lista de Turnos (Televisor)</title>
    <meta http-equiv="refresh" content="400">
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'turnos_app/styles.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      body {
        background: #ffffff;
        color: #111111;
        margin: 0;
        min-height: 100vh;
      }

      #caja-menu-flotante {
        display: flex;
      }

      /* Ocultar menú flotante en desktop */
      @media (min-width: 768px) {
        #caja-menu-flotante {
          display: none !important;
        }
      }

      .tv-logo {
        max-height: 80px;
        object-fit: contain;
      }

      .tv-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 32px;
        border-bottom: 3px solid #39FF14;
        background: #f5f5f5;
      }

      #dateTime {
        color: #333;
        font-size: 1.2rem;
        font-weight: 600;
      }

      .tv-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 1.9rem;
      }

      .tv-table thead tr {
        background: #f0f0f0;
        border-bottom: 3px solid #39FF14;
      }

      .tv-table thead th {
        padding: 18px 28px;
        text-align: left;
        color: #111;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .tv-table tbody tr {
        border-bottom: 1px solid #ddd;
        transition: background 0.2s;
      }

      .tv-table tbody tr:nth-child(even) {
        background: #f9f9f9;
      }

      .tv-table tbody td, .tv-table tbody th {
        padding: 22px 28px;
        vertical-align: middle;
        color: #111;
      }

      .cliente-nombre {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 1.8rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #111;
      }

      .turno-badge {
        display: inline-block;
        background: linear-gradient(90deg, #39FF14 0%, #00CC00 100%);
        color: #000;
        font-weight: 800;
        font-size: 2rem;
        padding: 8px 24px;
        border-radius: 8px;
        min-width: 80px;
        text-align: center;
      }

      .no-turnos {
        text-align: center;
        padding: 48px;
        color: #999;
        font-size: 1.4rem;
      }
    </style>
</head>

<body>
  <!-- HEADER CON LOGO Y RELOJ -->
  <div class="tv-header">
    <a href="{% url 'agendar_turno' %}">
      <img src="{% static 'turnos_app/logo-horizontal.png' %}" alt="Imperio Motos" class="tv-logo">
    </a>
    <p id="dateTime"></p>
  </div>

  <script>
    function updateDateTime() {
        const el = document.getElementById('dateTime');
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' };
        el.textContent = new Date().toLocaleString('es-ES', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();
  </script>

  <!-- TABLA DE TURNOS -->
  <div style="padding: 0 0 80px 0;">
    <table class="tv-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Motocicleta</th>
          <th style="text-align:center;">Turno</th>
        </tr>
      </thead>
      <tbody id="turnos-body">
        {% for turno in turnos %}
          <tr>
            <td>
              <div class="cliente-nombre">
                <img src="{% static 'turnos_app/user.png' %}" alt="user" style="width:36px;height:36px;border-radius:50%;background:#222;object-fit:cover;">
                {{ turno.nombre_cliente }}
              </div>
            </td>
            <td style="font-weight:700; font-size:1.8rem; text-transform:uppercase; color:#111;">
              {{ turno.referencia_motocicleta }}
            </td>
            <td style="text-align:center;">
              <span class="turno-badge">#{{ turno.numero_turno }}</span>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3" class="no-turnos">No hay turnos en cola</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    const ENDPOINT = "{% url 'api_turnos_ordenados' %}";
    const USER_IMG = "{% static 'turnos_app/user.png' %}";

    function renderTurnos(data) {
      const tbody = document.getElementById('turnos-body');
      if (!tbody) return;

      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="no-turnos">No hay turnos en cola</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(t => `
        <tr>
          <td>
            <div class="cliente-nombre">
              <img src="${USER_IMG}" alt="user" style="width:36px;height:36px;border-radius:50%;background:#222;object-fit:cover;">
              ${t.nombre_cliente}
            </div>
          </td>
          <td style="font-weight:700; font-size:1.8rem; text-transform:uppercase; color:#111;">
            ${t.referencia_motocicleta || ''}
          </td>
          <td style="text-align:center;">
            <span class="turno-badge">#${t.numero_turno ?? ''}</span>
          </td>
        </tr>
      `).join('');
    }

    async function cargarTurnos() {
      try {
        const res = await fetch(ENDPOINT, { cache: 'no-store' });
        const data = await res.json();
        renderTurnos(data);
      } catch (e) {
        console.error('Error cargando turnos:', e);
      }
    }

    cargarTurnos();
    setInterval(cargarTurnos, 3000);
  </script>

  <!-- MENU INFERIOR (solo movil) -->
  <div class="fixed z-50 w-full h-16 max-w-lg -translate-x-1/2 bg-gray-900 border border-gray-700 rounded-full bottom-4 left-1/2" id="caja-menu-flotante">
    <div class="grid h-full max-w-lg grid-cols-4 mx-auto">
      <a href="{% url 'reiniciar_numeros' %}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-800 group rounded-l-full">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-green-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 21 18">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.5 3h9.563M9.5 9h9.563M9.5 15h9.563M1.5 13a2 2 0 1 1 3.321 1.5L1.5 17h5m-5-15 2-1v6m-2 0h4"/>
        </svg>
        <span class="text-xs text-gray-400 group-hover:text-green-400">Ordenar</span>
      </a>
      <a href="{% url 'descargar_csv' %}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-800 group">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-green-400" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path d="M14.707 7.793a1 1 0 0 0-1.414 0L11 10.086V1.5a1 1 0 0 0-2 0v8.586L6.707 7.793a1 1 0 1 0-1.414 1.414l4 4a1 1 0 0 0 1.416 0l4-4a1 1 0 0 0-.002-1.414Z"/>
          <path d="M18 12h-2.55l-2.975 2.975a3.5 3.5 0 0 1-4.95 0L4.55 12H2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Zm-3 5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/>
        </svg>
        <span class="text-xs text-gray-400 group-hover:text-green-400">Descargar</span>
      </a>
      <a href="{% url 'agendar_turno' %}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-800 group">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-green-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 18">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 1v16M1 9h16"/>
        </svg>
        <span class="text-xs text-gray-400 group-hover:text-green-400">Nuevo</span>
      </a>
      <a href="{% url 'atender_turnos' %}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-800 group rounded-r-full">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-green-400" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 19">
          <path d="M7.324 9.917A2.479 2.479 0 0 1 7.99 7.7l.71-.71a2.484 2.484 0 0 1 2.222-.688 4.538 4.538 0 1 0-3.6 3.615h.002Z"/>
        </svg>
        <span class="text-xs text-gray-400 group-hover:text-green-400">Mecanico</span>
      </a>
    </div>
  </div>

  <script src="{% static 'turnos_app/js/alertas.js' %}"></script>
  <script src="{% static 'turnos_app/js/variables.js' %}"></script>
  <script>
    window.addEventListener('storage', function(e) {
        if (e.key === 'clienteParaLlamar') {
            const nombre = e.newValue;
            if (nombre) {
                Swal.fire({
                    title: `Turno de ${nombre}`,
                    text: "En reparación",
                    icon: 'info',
                    timer: 10000,
                    timerProgressBar: true,
                    showConfirmButton: false,
                    background: '#1a1a1a',
                    color: '#ffffff'
                });
                localStorage.removeItem('clienteParaLlamar');
            }
        }
    });
  </script>
</body>
</html>
