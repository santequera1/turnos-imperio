<!DOCTYPE html>
<html lang="es">
<head>
    <title>Iniciar Sesion - Imperio Motos</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'turnos_app/styles.css' %}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <img src="{% static 'turnos_app/logo-vertical.png' %}" alt="Imperio Motos" class="login-logo">

        <h2 style="text-align:center; font-size:20px; font-weight:700; color:#ffffff; margin-bottom:24px;">Iniciar Sesion</h2>

        {% if form.errors %}
        <div class="alert alert-error">
            Usuario o contrasena incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" autofocus placeholder="Usuario">
            </div>

            <div class="form-group">
                <label for="id_password">Contrasena</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="id_password" placeholder="Contrasena" style="padding-right:44px;">
                    <button type="button" id="toggle-password"
                        style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#888; padding:0; display:flex; align-items:center;">
                        <svg id="icon-eye" style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <svg id="icon-eye-off" style="width:20px;height:20px; display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
                Ingresar
            </button>
        </form>
    </div>
</div>

<script>
document.getElementById('toggle-password').addEventListener('click', function() {
    var input = document.getElementById('id_password');
    var iconEye = document.getElementById('icon-eye');
    var iconEyeOff = document.getElementById('icon-eye-off');
    if (input.type === 'password') {
        input.type = 'text';
        iconEye.style.display = 'none';
        iconEyeOff.style.display = 'block';
    } else {
        input.type = 'password';
        iconEye.style.display = 'block';
        iconEyeOff.style.display = 'none';
    }
});
</script>
</body>
</html>
