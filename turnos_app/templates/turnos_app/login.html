<!DOCTYPE html>
<html lang="es">
<head>
    <title>Iniciar Sesión - Imperio Motos</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static "turnos_app/css/tailwind.css" %}">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen" style="background-color: #000000; color: #FFFFFF">

    <div class="w-full max-w-md p-8">
        <div class="flex justify-center mb-8">
            <img src="{% static 'turnos_app/logo-vertical.png' %}" alt="logo" class="h-20">
        </div>

        <div class="rounded-lg p-8 shadow-lg">
            <h2 class="text-white text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>

            {% if form.errors %}
            <div class="bg-red-900/50 border border-red-500 text-red-300 px-4 py-3 rounded mb-4">
                Usuario o contraseña incorrectos.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <label for="id_username" class="block text-gray-300 text-sm font-medium mb-2">Usuario</label>
                    <input type="text" name="username" id="id_username" autofocus
                        class="w-full h-10 px-4 rounded  border  text-white focus:outline-none focus:"
                        placeholder="Usuario">
                </div>

                <div class="mb-6">
                    <label for="id_password" class="block text-gray-300 text-sm font-medium mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" name="password" id="id_password"
                            class="w-full h-10 px-4 pr-12 rounded  border  text-white focus:outline-none focus:"
                            placeholder="Contraseña">
                        <button type="button" id="toggle-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                            <svg id="icon-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="icon-eye-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-2 px-4  hover: text-white font-medium rounded transition duration-200">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

<script>
document.getElementById('toggle-password').addEventListener('click', function() {
    const input = document.getElementById('id_password');
    const iconEye = document.getElementById('icon-eye');
    const iconEyeOff = document.getElementById('icon-eye-off');
    if (input.type === 'password') {
        input.type = 'text';
        iconEye.classList.add('hidden');
        iconEyeOff.classList.remove('hidden');
    } else {
        input.type = 'password';
        iconEye.classList.remove('hidden');
        iconEyeOff.classList.add('hidden');
    }
});
</script>
</body>
</html>
