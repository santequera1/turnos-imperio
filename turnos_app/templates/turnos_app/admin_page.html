<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imperio Motos | Administración de Turnos</title>
</head>
<body style="background-color: #000000; color: #FFFFFF">
    <h1>Administración de Turnos</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Agendar Turno</button>
    </form>

    <h2>Listado de Turnos:</h2>
    <ul>
        {% for turno in turnos %}
            <li>{{ turno.nombre_cliente }} - {{ turno.referencia_motocicleta }} - {{ turno.numero_telefono }}</li>
        {% endfor %}
    </ul>
</body>
</html>
